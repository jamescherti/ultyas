[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultyas"
version = "1.1.3"
description = "A tool for converting code snippets from Ultisnips to YASnippet format"
readme = "README.md"
authors = [
  { name = "James Cherti" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.7, <4"
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: POSIX :: Other",
  "Topic :: Text Editors :: Emacs",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/jamescherti/ultyas"
Repository = "https://github.com/jamescherti/ultyas"

[project.scripts]
ultyas = "ultyas:command_line_interface"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultyas*"]
